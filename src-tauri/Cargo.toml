[package]
name = "catime"
version = "0.1.0"
description = "A lightweight floating clock, countdown, stopwatch and pomodoro timer"
authors = ["Catime contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/your-name/catime"
readme = "../README.md"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-runtime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
